;==============================================================================
; Tez Motors — RTP media ports. The firewall (bootstrap.sh) opens this exact
; UDP range; keep them in sync. ICE/STUN is on for the WebRTC softphone leg.
;==============================================================================
[general]
rtpstart=10000
rtpend=20000
icesupport=yes
; Public STUN helps the browser discover its srflx candidate; coturn (on this VPS)
; provides the TURN relay for restrictive client NATs. Set in turnserver.conf.
stunaddr=stun.l.google.com:19302
