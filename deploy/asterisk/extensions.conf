;==============================================================================
; Tez Motors — Asterisk dialplan (extensions.conf)
;
; Two jobs: (1) route inbound/outbound calls, (2) record every call and ship it
; to the CRM/AI pipeline on hangup. TOLL-FRAUD DEFENCE is the whole point of the
; outbound context: only Uzbekistan destinations are dialable; anything else is
; fail-closed (no catch-all reaches the trunk). Even if a softphone password
; leaks, an attacker cannot route premium/international calls through us.
;==============================================================================

[globals]
REC_DIR=/var/spool/asterisk/monitor   ; MixMonitor output (bootstrap ensures it exists)

;------------------------------------------------------------------------------
; Shared: start recording, then upload to the CRM on hangup.
; MixMonitor's 3rd arg runs when recording STOPS (hangup) → the .wav is complete.
; The upload script derives duration from the audio (Whisper does too), so we
; don't need ANSWEREDTIME here. ARG1=caller/callee, ARG2=direction.
;------------------------------------------------------------------------------
[sub-record]
exten => s,1,Set(REC=${REC_DIR}/${ARG2}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,MixMonitor(${REC},,/etc/asterisk/scripts/upload-recording.sh "${ARG1}" "${ARG2}" "${REC}")
 same => n,Return()

;------------------------------------------------------------------------------
; INBOUND — calls arriving from the Uztelecom trunk. Record, ring the rep.
;------------------------------------------------------------------------------
[from-trunk]
exten => _X.,1,NoOp(Inbound from ${CALLERID(num)} -> DID ${EXTEN})
 same => n,GoSub(sub-record,s,1(${CALLERID(num)},inbound))
 same => n,Dial(PJSIP/6001,40)
 same => n,Hangup()
; (later) on no-answer / busy: send to the AI receptionist (AudioSocket bridge).

;------------------------------------------------------------------------------
; OUTBOUND / INTERNAL — from the softphone. UZ-ONLY ALLOWLIST.
;------------------------------------------------------------------------------
[from-internal]
; Internal extension-to-extension (future multi-rep): 4-digit 6xxx.
exten => _6XXX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; UZ in full E.164: 998 + 9 digits (e.g. 998901234567). Record + dial the trunk.
exten => _998XXXXXXXXX,1,NoOp(Outbound UZ ${EXTEN})
 same => n,GoSub(sub-record,s,1(${EXTEN},outbound))
 same => n,Dial(PJSIP/${EXTEN}@uztelecom,60)
 same => n,Hangup()

; Convenience: bare 9-digit local number → prepend 998, re-enter the allowlist.
exten => _XXXXXXXXX,1,Goto(from-internal,998${EXTEN},1)

; Everything else is BLOCKED. This pattern never touches the trunk; it just plays
; a "not in service" prompt. (Anything not matched at all is also rejected by
; Asterisk — fail-closed by default. This is the explicit, friendly version.)
exten => _X.,1,NoOp(BLOCKED non-UZ outbound: ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()
