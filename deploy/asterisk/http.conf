;==============================================================================
; Tez Motors — Asterisk HTTP/WS server. Powers the WebRTC softphone (wss:8089).
; Plain http (8088) is bound to localhost only (ARI/debug); the firewall must
; NOT expose 8088 publicly. TLS uses the Let's Encrypt cert for pbx.tezmotors.uz
; (bootstrap installs a certbot deploy-hook that copies the cert to /etc/asterisk/keys
; and reloads Asterisk on renewal).
;==============================================================================
[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/fullchain.pem
tlsprivatekey=/etc/asterisk/keys/privkey.pem
