# Tez Motors — coturn (TURN/STUN) for the WebRTC softphone's NAT media traversal.
# Installed by bootstrap.sh; deployed by apply.sh → /etc/turnserver.conf.
listening-port=3478
min-port=49152
max-port=65535
fingerprint
lt-cred-mech
realm=pbx.tezmotors.uz
server-name=pbx.tezmotors.uz

# Auth — use a shared REST secret (time-limited credentials the SIP.js client mints).
# Set a LONG random value here AND give the same to the admin app as the TURN secret.
# Generate:  openssl rand -hex 32
use-auth-secret
static-auth-secret=<RANDOM_TURN_SECRET>

# On a 1:1-NAT cloud VPS (e.g. Oracle), advertise the PUBLIC IP for relay candidates:
# external-ip=<VPS_PUBLIC_IP>

# Reuse the Let's Encrypt cert (TURN over TLS, port 5349) — optional but nice.
# cert=/etc/asterisk/keys/fullchain.pem
# pkey=/etc/asterisk/keys/privkey.pem
# tls-listening-port=5349

no-cli
no-multicast-peers
# Don't relay to private/loopback ranges (anti-abuse).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
