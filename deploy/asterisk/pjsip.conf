;==============================================================================
; Tez Motors — Asterisk PJSIP (chan_pjsip) config-as-code
;
; Runs on a PUBLIC-IP VPS (NOT the Vostro — that box is behind NAT + Cloudflare
; WARP with no inbound reachability). Non-secret structure lives here; the trunk
; password, registration string, your DID, and the provider IP ranges live in
; pjsip_secrets.conf (gitignored — copy pjsip_secrets.conf.example and fill from
; the Uztelecom welcome email). apply.sh rsyncs both to /etc/asterisk/.
;
; SECURITY: allowguest is off (global, see the bundled defaults), endpoints use
; long random secrets, the trunk is matched by provider IP (identify), and the
; dialplan (extensions.conf) allowlists OUTBOUND destinations to cap toll fraud.
;==============================================================================

;------------------------------------------------------------------------------
; TRANSPORTS
;------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; The VPS public IP — set by bootstrap.sh (NAT awareness; harmless on a clean
; public IP, required if the VPS itself is behind 1:1 NAT e.g. Oracle Cloud).
; external_media_address=PUBLIC_IP
; external_signaling_address=PUBLIC_IP

[transport-wss]
; WebRTC softphone leg (browser ↔ Asterisk over secure WebSocket). The TLS cert
; is configured in http.conf (Let's Encrypt for pbx.tezmotors.uz).
type=transport
protocol=wss
bind=0.0.0.0:8089

;------------------------------------------------------------------------------
; UZTELECOM TRUNK
; Works for BOTH auth styles Uztelecom may issue:
;   - registration  → we REGISTER to them (uztelecom_reg in secrets)
;   - IP-auth        → they identify us by IP; we identify them by IP (uztelecom_identify)
; Keep whichever the welcome email specifies; leaving both is harmless.
;------------------------------------------------------------------------------
[uztelecom]
type=endpoint
context=from-trunk                 ; inbound calls land here (see extensions.conf)
disallow=all
allow=alaw                         ; G.711 a-law — the CIS/UZ standard
allow=ulaw
;allow=g729                        ; enable only if licensed + the trunk needs it
direct_media=no                    ; keep media on the PBX → MixMonitor can record + NAT-safe
rtp_symmetric=yes                  ; learn the real RTP source (NAT/SBC friendly)
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
language=ru
outbound_auth=uztelecom_auth       ; defined in pjsip_secrets.conf (registration trunks)
aors=uztelecom_aor
; from_user / from_domain are provider-specific → set in pjsip_secrets.conf
; via a (+) append so the secret values merge into this endpoint:
;   [uztelecom](+)
;   from_user=<your SIP account / DID>
;   from_domain=<provider domain>

[uztelecom_aor]
type=aor
; contact = the provider's SIP server (sip:host:port) → set in pjsip_secrets.conf:
;   [uztelecom_aor](+)
;   contact=sip:<PROVIDER_SIP_HOST>:5060
qualify_frequency=60               ; keepalive OPTIONS so inbound NAT pinhole stays open

;------------------------------------------------------------------------------
; WEBRTC SOFTPHONE (admin PWA — phase 3). Rep extension 6001.
; Canonical pjsip idiom: same section name, one object per `type=`. Add more reps
; by copying these two blocks (6002, 6003…) + a matching [600X-auth] in secrets.
;------------------------------------------------------------------------------
[6001]
type=endpoint
transport=transport-wss
context=from-internal              ; outbound dialplan w/ the toll-fraud allowlist
disallow=all
allow=opus                         ; browser-native, best quality on WebRTC
allow=alaw
allow=ulaw
webrtc=yes                         ; turns on DTLS-SRTP, AVPF, ICE, rtcp-mux (AST 18+)
dtmf_mode=rfc4733
auth=6001-auth
aors=6001
language=ru

[6001]
type=aor
max_contacts=1
remove_existing=yes

; [6001-auth] (type=auth, username=6001 + a LONG random password) is in pjsip_secrets.conf.

;------------------------------------------------------------------------------
; Provider secrets + per-endpoint passwords (gitignored).
;------------------------------------------------------------------------------
#include "pjsip_secrets.conf"
